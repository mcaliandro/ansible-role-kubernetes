---

kubernetes_packages:
- kubeadm
- kubelet
- kubectl

kubernetes_supported_cni_plugins:
- calico
- flannel
- none

kubernetes_supported_os_family: ["Debian", "RedHat"]

# APT package repository
kubernetes_apt_repo_url: "https://pkgs.k8s.io/core:/{{ kubernetes_release_channel }}:/v{{ kubernetes_version }}/deb/"
kubernetes_apt_repo_key: "{{ kubernetes_apt_repo_url }}/Release.key"

# YUM package repository
kubernetes_yum_repo_url: "https://pkgs.k8s.io/core:/{{ kubernetes_release_channel }}:/v{{ kubernetes_version }}/rpm/"
kubernetes_yum_repo_key: "{{ kubernetes_yum_repo_url }}/repodata/repomd.xml.key"

# Configuration API
kubernetes_kubeadm_config_dir: /etc/kubernetes/kubeadm-config.d
kubernetes_apiserver_audit_log_dir: /var/log/kubernetes/audit
kubernetes_apiserver_admission_config_file: "{{ kubernetes_kubeadm_config_dir }}/admission-config.yaml"
kubernetes_apiserver_audit_policy_file: "{{ kubernetes_kubeadm_config_dir }}/audit-policy.yaml"
kubernetes_apiserver_encryption_config_file: "{{ kubernetes_kubeadm_config_dir }}/encryption-config.yaml"

# crictl configuration
kubernetes_crictl_runtime_endpoint: unix:///var/run/containerd/containerd.sock
kubernetes_crictl_image_endpoint: unix:///var/run/containerd/containerd.sock

# CNI plugins manifests
kubernetes_calico_cni_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/v{{ kubernetes_cni_plugin_version }}/manifests"
kubernetes_flannel_cni_manifest_url: "https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml"
